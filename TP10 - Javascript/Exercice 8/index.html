<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur de Devis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="formulaire-saisie">
    <h2>Créer un nouveau devis</h2>
    <form id="devisForm">
      <fieldset>
        <legend>Infos Générales</legend>
        <input type="text" id="in_numero" placeholder="Numéro du devis" required>
        <input type="date" id="in_date" required>
        <input type="text" id="in_validite" placeholder="Validité (ex: 30 jours)">
        <input type="number" id="in_tva" placeholder="TVA (%)" value="20">
      </fieldset>

      <div class="colonnes">
        <fieldset>
          <legend>Entreprise (Émetteur)</legend>
          <input type="text" id="in_ent_nom" placeholder="Nom entreprise" required>
          <textarea id="in_ent_adr" placeholder="Adresse"></textarea>
          <input type="email" id="in_ent_email" placeholder="Email">
        </fieldset>

        <fieldset>
          <legend>Client</legend>
          <input type="text" id="in_cli_nom" placeholder="Nom client" required>
          <textarea id="in_cli_adr" placeholder="Adresse"></textarea>
        </fieldset>
      </div>

      <fieldset id="articles-container">
        <legend>Articles</legend>
        <div class="ligne-article">
          <input type="text" placeholder="Description" class="art-desc" required>
          <input type="number" placeholder="Prix HT" class="art-prix" step="0.01" required>
          <input type="number" placeholder="Qté" class="art-qte" required>
        </div>
      </fieldset>
      
      <button type="button" id="addArticle">+ Ajouter un article</button>
      <hr>
      <button type="submit">GÉNÉRER LE DEVIS</button>
    </form>
  </div>

  <div id="devis-resultat" class="devis" style="display: none;">
    <div class="header">
      <h1>DEVIS <span id="numeroDevis"></span></h1>
      <div class="infos">
        <p>Date : <span id="dateDevis"></span></p>
        <p>Validité : <span id="validiteDevis"></span></p>
      </div>
    </div>

    <div class="bloc-client">
      <div>
        <h3 id="nomEntreprise"></h3>
        <p id="adresseEntreprise"></p>
        <p id="emailEntreprise"></p>
      </div>
      <div>
        <h4>CLIENT</h4>
        <p id="nomClient"></p>
        <p id="adresseClient"></p>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>Description</th><th>Prix</th><th>Qté</th><th>Total</th></tr>
      </thead>
      <tbody id="tableArticles"></tbody>
    </table>

    <div class="total">
      <p>Sous-total : <span id="sousTotal"></span></p>
      <p>TVA : <span id="tva"></span></p>
      <div class="grand-total">TOTAL : <span id="totalFinal"></span></div>
    </div>
    <button onclick="window.print()">Imprimer en PDF</button>
  </div>

  <script src="JS_8.js"></script>
</body>
</html>
