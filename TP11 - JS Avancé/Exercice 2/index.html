<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journée Porte Ouverte</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Formulaire de visite</h1>

        <form id="visitorForm">

            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" required>
            </div>

            <div class="form-group">
                <label for="bac">Étude suivie :</label>

                <select id="bac" required>
                    <option value="">-- Choisir --</option>
                    <option value="Bac Pro">Bac Pro</option>
                    <option value="STI">STI</option>
                    <option value="STMG">STMG</option>
                    <option value="Général">Général</option>
                </select>
            </div>

            <button type="submit">Valider</button>

        </form>

        <h2>Liste des visiteurs</h2>

        <table id="visitorTable">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Bac suivi</th>
                </tr>
            </thead>

            <tbody>
                <!-- Les visiteurs seront ajoutés ici -->
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
